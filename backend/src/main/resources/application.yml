spring:
  application:
    name: dsuplementos-api
  profiles:
    default: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    listener:
      simple:
        default-requeue-rejected: false
        prefetch: 1
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  jwt:
    # Use uma chave aleatoria com pelo menos 32 caracteres fora do Git.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
  admin:
    enabled: ${APP_ADMIN_ENABLED:false}
    name: ${APP_ADMIN_NAME:}
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  seed-catalog:
    enabled: ${APP_SEED_CATALOG:true}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:}
    to: ${APP_MAIL_TO:}
    api-key: ${RESEND_API_KEY:}
    base-url: ${APP_MAIL_BASE_URL:https://api.resend.com}
    poll-interval-ms: ${APP_MAIL_POLL_INTERVAL_MS:30000}
  messaging:
    orders:
      enabled: ${APP_MESSAGING_ORDERS_ENABLED:false}
      exchange: ${APP_MESSAGING_ORDERS_EXCHANGE:dsuplementos.pedidos}
      queue: ${APP_MESSAGING_ORDERS_QUEUE:dsuplementos.pedidos.email.v1}
      routing-key: ${APP_MESSAGING_ORDERS_ROUTING_KEY:pedido.criado}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
