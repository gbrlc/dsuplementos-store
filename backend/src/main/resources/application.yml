spring:
  application:
    name: dsuplementos-api
  profiles:
    default: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  jwt:
    # Use uma chave aleatoria com pelo menos 32 caracteres fora do Git.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
  admin:
    enabled: ${APP_ADMIN_ENABLED:false}
    name: ${APP_ADMIN_NAME:}
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  seed-catalog:
    enabled: ${APP_SEED_CATALOG:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
