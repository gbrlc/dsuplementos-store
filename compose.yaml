services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dsuplementos
      POSTGRES_USER: dsuplementos
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Defina LOCAL_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsuplementos -d dsuplementos"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "8080:10000"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dsuplementos
      DB_USERNAME: dsuplementos
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Defina LOCAL_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com ao menos 32 bytes}
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      APP_ADMIN_ENABLED: "false"
      APP_MESSAGING_ORDERS_ENABLED: ${APP_MESSAGING_ORDERS_ENABLED:-false}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_TO: ${APP_MAIL_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RABBITMQ_ADDRESSES: rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
  rabbitmq:
    image: rabbitmq:4-management
    profiles: [messaging]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres-data:
  uploads:
  rabbitmq-data:
