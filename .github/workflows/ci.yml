name: CI
on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_DB_PASSWORD: senha-descartavel-exclusiva-do-ci
      JWT_SECRET: chave-descartavel-exclusiva-do-ci-com-mais-de-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
      - name: Build Docker image
        run: docker compose build api
      - name: Smoke test container and migrations
        run: |
          docker compose up -d postgres api
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors --max-time 5 --retry-max-time 60 http://localhost:8080/api/produtos
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down --volumes
